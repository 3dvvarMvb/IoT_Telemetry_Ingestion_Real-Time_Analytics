apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescaledb-telemetry
    access: proxy
    url: timescale:5432
    user: iot_admin
    database: telemetry_db
    isDefault: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: iot_pass
    editable: true
