apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-telemetry-ingest
  labels:
    app: iot-telemetry-ingest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iot-telemetry-ingest
  template:
    metadata:
      labels:
        app: iot-telemetry-ingest
    spec:
      containers:
        - name: ingest
          image: iot-telemetry-ingest:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iot-telemetry-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: iot-telemetry-ingest
